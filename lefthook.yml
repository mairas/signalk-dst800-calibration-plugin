pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "*.ts"
      run: npm run typecheck && npm run typecheck:ui
      fail_text: "TypeScript type checking failed. Run './run typecheck' to see errors."
    lint:
      glob: "*.ts"
      run: npm run lint
      fail_text: "ESLint found issues. Run './run lint-fix' to auto-fix."
    format:
      glob: "*.ts"
      run: npm run format:check
      fail_text: "Prettier formatting issues. Run './run format' to fix."
