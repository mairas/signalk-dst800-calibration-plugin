<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Airmar DST Config</title>
    <style>
      /* The admin stylesheet, added below at runtime, supplies everything else. */
      .dst-header {
        position: sticky;
        top: 0;
        z-index: 1020;
        background: var(--bs-body-bg, #fff);
        border-bottom: 1px solid var(--bs-border-color, #dee2e6);
        box-shadow: 0 0.125rem 0.25rem rgb(0 0 0 / 7.5%);
      }
      /* Leave the sticky header's height clear when jumping to a section. */
      section[id] {
        scroll-margin-top: 8rem;
      }
      .dst-value-input {
        max-width: 16rem;
      }
      .dst-menu {
        position: relative;
      }
      .dst-menu > summary {
        list-style: none;
      }
      .dst-menu > summary::-webkit-details-marker {
        display: none;
      }
      .dst-menu-list {
        position: absolute;
        right: 0;
        top: calc(100% + 0.25rem);
        min-width: 12rem;
        padding: 0.25rem 0;
        z-index: 1030;
      }
      .dst-curve-plot {
        max-height: 20rem;
      }
      .dst-curve-grid {
        stroke: var(--bs-border-color, #dee2e6);
        stroke-width: 1;
      }
      .dst-curve-label {
        fill: var(--bs-secondary-color, #6c757d);
        font-size: 10px;
      }
      .dst-curve-line {
        fill: none;
        stroke: var(--bs-primary, #0d6efd);
        stroke-width: 2;
      }
      .dst-curve-stored {
        fill: none;
        stroke: var(--bs-secondary-color, #6c757d);
        stroke-width: 1.5;
        stroke-dasharray: 4 3;
      }
      .dst-curve-point {
        fill: var(--bs-primary, #0d6efd);
      }
      @media (max-width: 575.98px) {
        dst-app .btn {
          min-height: 44px;
        }
      }
    </style>
    <script>
      // Borrow the Signal K admin UI's stylesheet so the console looks native.
      // Its file name carries a build hash, so read it from the admin page
      // itself; server 2.33 serves no Vite manifest. Failure is not fatal.
      fetch('/admin/', { credentials: 'same-origin' })
        .then((r) => (r.ok ? r.text() : Promise.reject(new Error(String(r.status)))))
        .then((page) => {
          const admin = new DOMParser().parseFromString(page, 'text/html')
          for (const sheet of admin.querySelectorAll('link[rel="stylesheet"]')) {
            const link = document.createElement('link')
            link.rel = 'stylesheet'
            link.href = new URL(sheet.getAttribute('href'), new URL('/admin/', location.href)).href
            document.head.appendChild(link)
          }
        })
        .catch(() => {
          /* the console renders unstyled */
        })
    </script>
  </head>
  <body>
    <dst-app></dst-app>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
