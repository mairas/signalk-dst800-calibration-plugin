# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-GB

# Under 250 characters — the schema's limit.
tone_instructions: >-
  Name the trigger, the code path, and the user-visible consequence for every
  finding. If you cannot name one, do not raise it. No praise, no preamble, no
  restating the diff. Silence beats a nitpick.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false

  high_level_summary_instructions: |
    Write in present tense: "adds", not "added".
    Lead with what changes for someone configuring a sensor from this console,
    not with the file list. Do not restate the PR description back to the author.

  pre_merge_checks:
    title:
      mode: warning
      requirements: |
        A reader who sees only the title should understand what the PR does.
        Conventional-commit form: <type>(<scope>): <subject>, imperative mood.
    # Quoted: bare `off` is a YAML 1.1 boolean, and this field takes a string.
    description:
      mode: "off"

  tools:
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    shellcheck:
      enabled: true
    eslint:
      enabled: true
    # README and AGENTS.md are deliberate prose with a deliberate voice.
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

  path_filters:
    - '!package-lock.json'
    - '!tools/*.ipynb'

  path_instructions:
    - path: '**/*'
      instructions: |
        ## Evidence, not impressions
        Every finding states the trigger, the code path it runs through, and what
        the user sees. A finding you cannot express that way is not one. Say
        plainly when you are unsure rather than hedging an assertion.

        ## What this plugin is
        An interactive configuration console for Airmar DST-family NMEA 2000
        sensors. The **device is authoritative**: every screen reads live from it
        and every write reports the device's own answer. The plugin persists only
        which device the console is pointed at. Flag anything that caches a
        setting as the source of truth, or that reports a write as successful
        without the device having acknowledged it.

        ## Do not ask for these
        - **A Makefile.** `./run` is the entry point. Each target is `function
          name {`, a `#@ Description` line, then a `#@ Category: X` line, in that
          order — the help text is generated by walking the file with awk.
        - **`npm` invoked directly in docs.** Contributors use `./run`.
        - **A CHANGELOG.** There has never been one.
        - **Device support driven by a model table.** Capabilities are discovered
          by probing the device at runtime, on purpose: the same Airmar hardware
          is rebadged by several vendors and the family includes depth-only and
          speed-only variants.

        ## Scope
        One logical change per PR. Flag substantial unrelated work and suggest a
        separate PR; a called-out trivial fly-by fix is fine. Do not ask for
        refactoring of code the PR merely touches.

    - path: 'src/protocol/**'
      instructions: |
        This is the NMEA 2000 wire layer. Three rules are settled and are not
        open questions; flag a change that breaks one.

        **Encode through canboatjs JSON on `nmea2000JsonOut`.** Hand-built
        Actisense strings are gone. canboatjs produces byte-identical output,
        which the codec tests pin against captured bytes. Do not suggest
        reintroducing string construction "for clarity".

        **Every PGN 126720 parameter list leads with parameter 1 (manufacturer
        code 135) and parameter 4 (the proprietary ID).** canboatjs narrows the
        126720 variant by those match fields and throws `unable to read` without
        them. This is not redundancy to tidy away.

        **Proprietary IDs 1 (master reset) and 130 (EEPROM restore) have no
        `@canboat/ts-pgns` definition** and are the sole exception to the first
        rule. Both are sent as PGN 126720 addressed to the device, not wrapped in
        a 126208 Command.

        `N2KAnalyzerOut`, `nmea2000out` and `nmea2000JsonOut` are not part of the
        typed `ServerAPI`. They are reached through one adapter module so a
        server change breaks one file. Flag a second place that widens the app
        type.

    - path: 'src/session/**'
      instructions: |
        Airmar PGNs carry no transaction id, so reply correlation is structural
        and easy to get subtly wrong. Judge changes by what happens on a busy bus
        with another chart plotter configuring the same device.

        Silence is **unknown**, never "unsupported". canboatjs drops a
        fast-packet message that lost a frame without notice, which is
        indistinguishable from a device that does not implement the PID. Flag any
        code that collapses the three outcomes — answered, rejected with a code,
        no answer — into two.

        Access Level 1 expires 15 minutes after unlock or at power-down and is
        not stored in EEPROM. Flag an assumption that an unlock is still valid.

    - path: 'test/**'
      instructions: |
        **Judge whether a test can fail.** Value tests that fail when the
        production change is reverted. Flag assertions on a stub's recorded
        intent rather than on observable state, and on internals an equivalent
        implementation would change.

        The codec tests pin exact byte strings on purpose. That is the only thing
        that proves the JSON encoding still matches what the device accepts, so
        do not suggest relaxing them to structural assertions.

        A bus fake that cannot drop, delay, duplicate or misattribute a frame
        cannot exercise the session layer's real failure modes. Flag session
        tests that only use a well-behaved fake.

    - path: '**/*.md'
      instructions: |
        Documentation describes the current state. Flag implementation-status
        language ("Step 3", "TODO", "currently implemented as"), build
        narratives, and unchecked checklist items.

        This repository is **public**, so flag detail that identifies *our own
        infrastructure*: host names, addresses, ports, filesystem paths,
        usernames, or a list of what runs on our machines. Vessel names are
        ordinary test data and need no redaction.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
