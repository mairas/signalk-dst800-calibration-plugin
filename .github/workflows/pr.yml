name: PR checks

# No branch filter: a PR stacked on another branch gets checked before it is
# retargeted to main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  # The shared Signal K plugin workflow: validates package.json, the entry
  # point and plugin.schema(), runs a stop/start lifecycle test, scans for
  # deprecated APIs, simulates an App Store install and checks the npm pack
  # file list, across Linux, Linux arm64, macOS and Windows on Node 22 and 24.
  #
  # Pinned to a commit rather than @master: this repository publishes to npm,
  # and a branch ref would let another organisation's push run here unreviewed.
  # 591e56a0 is SignalK/signalk-server master as of v2.33.0.
  checks:
    permissions:
      contents: read
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@591e56a05b4f90952991f4e6c9d81be751394660
    with:
      # npm run ci is typecheck, typecheck:ui, lint, format:check and the
      # tests, so the gate matches what ./run ci runs locally.
      test-command: npm run ci
      build-command: npm run build && npm run build:ui
      node-versions: '["22", "24"]'
      enable-armv7: false
      enable-signalk-integration: false

  # Branch protection requires only this job. List every other job in needs,
  # including jobs defined in this file.
  status:
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
